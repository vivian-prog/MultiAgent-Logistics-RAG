# Agent参数配置文件
# 用于鲁棒性实验：修改参数观察指标变化
# 所有参数均可被仿真模块动态读取

# ==================== 无人机 (UAV) 参数 ====================
uav:
  # 运动控制参数
  max_speed: 0.3              # 最大速度 (grid/step)，原始值: 0.3
  volatility: 0.02            # 速度波动标准差，原始值: 0.02

  # 物理参数
  radius: 0.3                 # 无人机半径 (grid)，用于碰撞检测，原始值: 0.3
  tolerance: 0.1              # 到达目标点的容差，原始值: 0.1

  # 仿真参数
  default_max_steps: 1000     # 默认最大仿真步数
  default_map_name: "Map1"    # 默认地图名称

  # 高度参数
  default_cruise_height: 15   # 默认巡航高度 (grid)
  max_height: 20              # 最大飞行高度 (grid)

  # 电量模型（可选扩展）
  battery_capacity: 100       # 电池容量 (%)
  battery_drain_rate: 0.5     # 每步电量消耗率 (%)

# ==================== 卡车 (Truck) 参数 ====================
truck:
  # 油耗模型参数
  base_fuel_per_100km: 30     # 空车百公里油耗 (L)，原始值: 30
  load_factor: 0.3            # 载重油耗系数（载重每增加1吨，油耗增加30%）
  speed_factor: 0.005         # 速度影响系数（偏离经济时速的油耗增量）
  economic_speed: 60          # 经济时速 (km/h)

  # 道路类型油耗系数
  road_type_factors:
    motorway: 1.0             # 高速路
    trunk: 1.1                # 主干道
    primary: 1.2              # 一级公路
    secondary: 1.3            # 二级公路
    tertiary: 1.4             # 三级公路
    residential: 1.5          # 居民区道路
    unclassified: 1.4         # 未分类道路

  # 费用参数
  fuel_price: 7.5             # 油价 (元/L)

  # 默认载重
  default_load_weight: 5.0    # 默认载重 (吨)

  # 路线规划参数
  default_profile: "car"      # GraphHopper默认profile

# ==================== 仓储机器人 (Robot) 参数 ====================
robot:
  # 运动参数
  speed_m_per_sec: 1.0        # 移动速度 (m/s)，原始值: 1.0

  # 抓取参数
  grip_ratio: 10.0            # 夹持力系数（夹持力 = 货物重量 * grip_ratio）

  # 电量模型
  battery_capacity: 100       # 电池容量 (%)
  battery_drain_per_sec: 0.02 # 每秒电量消耗率 (%)

  # 仿真加速
  time_scale: 10.0            # 时间加速因子（10倍速避免仿真超时）

# ==================== 仿真全局参数 ====================
simulation:
  # 超时设置
  task_timeout: 120           # 单个任务超时时间 (秒)
  poll_interval: 1            # 轮询间隔 (秒)
  max_retries: 120            # 最大轮询次数

  # 坐标系参数（深圳地区）
  origin_lng: 113.70          # 参考原点经度
  origin_lat: 22.40           # 参考原点纬度
  scale_factor: 1000.0        # 坐标缩放因子 (0.001度 ≈ 1个Grid单位 ≈ 100米)

# ==================== LLM/RAG 参数 ====================
llm:
  # 温度参数
  temperature: 0.7            # 生成温度

  # 超时设置
  rag_timeout: 60             # RAG请求超时 (秒)
  llm_timeout: 120            # LLM请求超时 (秒)
